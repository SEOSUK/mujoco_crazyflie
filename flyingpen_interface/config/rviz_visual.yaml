/**:
  ros__parameters:
    environment.type: "wall" # "surface_chain", "wall", or "cylinder"
    environment.marker_topic: "/rviz/environment"
    wind_indicator.enable: true
    wind_indicator.wind_topic: "/crazyflie/in/wind"
    wind_indicator.marker_topic: "/rviz/wind_indicator"
    wind_indicator.origin.x: -0.05
    wind_indicator.origin.y: 0.0
    wind_indicator.origin.z: 0.0
    wind_indicator.pole_height: 0.08
    wind_indicator.mast_height: 0.34
    wind_indicator.bend_gain: 4.0
    wind_indicator.max_bend: 0.14
    wind_indicator.flutter_gain: 0.35
    wind_indicator.flutter_hz: 6.0
    cylinder.pos.x: 1.5
    cylinder.pos.y: 0.0
    cylinder.pos.z: 0.0
    cylinder.radius: 1.0
    cylinder.half_height: 10.0
    wall.pos.x: 0.6
    wall.pos.y: 0.0
    wall.pos.z: 0.3005
    wall.size.x: 0.2
    wall.size.y: 1.5
    wall.size.z: 0.3
    wall.pose_topic: "/environment/wall_pose"
    wall.twist_topic: "/environment/wall_twist"
    wall.frame: "mujoco_wall"
    wall.velocity_scale: 1.0
    wall.angular_velocity_scale: 0.3
    wall.rgba: [0.8, 0.4, 0.2, 0.4]
    far_wall.pos.x: 2.0
    far_wall.pos.y: 0.0
    far_wall.pos.z: 0.0
    far_wall.size.x: 0.05
    far_wall.size.y: 5.0
    far_wall.size.z: 5.0
    far_wall.rgba: [0.75, 0.85, 0.95, 0.35]

rviz_visual:
  ros__parameters:
    mesh_resource: "package://plant/data/assets/cf21B/cf21B_full.stl"
    mesh_scale: 0.001
    mesh_alpha: 1.0
    mob_topic_2nd_order: "/crazyflie/out/ee_applied_mob_2nd"
    mob_topic_consistency: "/crazyflie/out/ee_applied_mob_2nd_tau"
    contact_frame_quat_topic_pure: "/estimated_contact_frame_quat_pure"
    contact_frame_quat_topic: "/estimated_contact_frame_quat"
    normal_debug_metrics_topic_pure: "/normal_vector/debug_metrics_pure"
    normal_debug_metrics_topic: "/normal_vector/debug_metrics"
    control_metrics_topic: "/su/debug/control_metrics"
    ke_normal_velocity_epsilon: 0.01
    ke_normal_force_epsilon: 0.005
    contact_force_lpf_omega: 12.0
    cylinder.rgba: [0.75, 0.93, 0.75, 0.25]
    wall.pose_topic: "/environment/wall_pose"
    wall.twist_topic: "/environment/wall_twist"
    wall.frame: "mujoco_wall"
    wall.velocity_scale: 1.0
    wall.angular_velocity_scale: 0.3
    wall.rgba: [0.8, 0.4, 0.2, 0.4]
    publish_hz: 20.0
    history_sample_period: 1.5
    history_duration: 30.0
