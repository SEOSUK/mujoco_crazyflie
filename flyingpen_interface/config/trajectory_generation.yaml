trajectory_generation:
  ros__parameters:
    # "position_loop_embedding" or "velocity_loop_direct"
    command_embedding_mode: "position_loop_embedding"

    force_control:
      mode: "paper" # "legacy" or "paper"
      legacy:
        kp: 5.0  # normal-force proportional gain
        kd: 0.005  # normal-force derivative gain
        v_n_max: 0.20  # [m/s], saturation bound for commanded normal velocity
        derivative_cutoff_rad_s: 3.0  # derivative LPF cutoff [rad/s]
      paper:
        k_f: 15.0  # normal-force feedback gain
        k_l: 4.0  # normal-velocity leakage gain
        v_n_max: 0.30  # [m/s], saturation bound for commanded normal velocity

    # manual keyboard velocity frame during velocity mode
    manual_velocity_frame: "contact" # "contact" or "world"

    # Trajectory shape/size/speed are sourced only from su_params.yaml -> su_position.*
    # Keep only non-overlapping trajectory behavior tuning here.
    pattern:
      ramp_sec: 1.0  # ramp-up time for trajectory activation [s]
