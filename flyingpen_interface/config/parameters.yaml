fk_ik_transform:
  ros__parameters:
    end_effector_offset: [0.1, 0.0, 0.04]

command_publisher:
  ros__parameters:
    position_tick: [0.1, 0.1, 0.1]
    velocity_tick: [0.055, 0.055, 0.055]
    yaw_tick_deg: 2.0
    force_tick: 0.01
    wall_angular_velocity_tick: 0.01
    gravity: 9.81
    calibration_window_sec: 1.0

plant:
  ros__parameters:
    physics_hz: 1000.0
    pub_hz: 400.0
    viewer_hz: 60.0
    end_effector_offset: [0.1, 0.0, 0.04]
    omega_des: 0.0  # [rad/s], 0: rotation suppression/translation mode
    kp_omega: 5.0  # [m/rad], signed yaw-rate-error to lateral-velocity gain
    kd_omega: 1.0  # [m*s/rad], yaw-rate-error derivative gain
    v_lat_max: 1.0  # [m/s], symmetric clamp for the final lateral velocity command
    error_omega_dot_lpf:
      cutoff_hz: 1.0  # [Hz], 1st-order LPF for yaw-rate-error derivative
    omega_fext_lpf:
      cutoff_hz: 1.0  # [Hz], 1st-order LPF for MOB force-direction yaw-rate proxy

    arm_xy: 0.035355
    k_tau: 0.00569278844371417
    motor_dir: [1.0, -1.0, 1.0, -1.0]
    thrust_min: 0.0
    thrust_max: 0.20

    noise:
      enable: false
      seed: 0
      hz: 30.0                     # update rate: draw new noise every 1/hz seconds
      # pos_amp: [5e-3, 5e-3, 5e-3]      # absolute maximum noise magnitude (per axis)
      vel_amp: [5e-3, 5e-3, 5e-3]
      att_amp: [2e-2, 2e-2, 2e-2]
      ang_vel_amp: [2e-4, 2e-4, 2e-4]
      ang_acc_amp: [5e-4, 5e-4, 5e-4]
      pos_var: [1e-8, 1e-8, 1e-8]      # stationary Gaussian variance before clipping to +/- amp
      vel_var: [1e-8, 1e-8, 1e-8]
      att_var: [1e-9, 1e-9, 1e-9]
      ang_vel_var: [1e-9, 1e-9, 1e-9]
      ang_acc_var: [1e-8, 1e-8, 1e-8]
      lpf:
        enable: false
        cutoff_hz: 5.0

    state_filter:
      pos:
        enable: false
        cutoff_hz: 5.0
      att:
        enable: false
        cutoff_hz: 15.0
      vel:
        enable: false
        cutoff_hz: 10.0
      ang_vel:
        enable: false
        cutoff_hz: 30.0
      acc:
        enable: false
        cutoff_hz: 3.0

    ang_acc_lpf:
      enable: false
      cutoff_hz: 1.0
        
    actuator:
      delay:
        enable: true
        sec: 0.0005
      lpf:
        enable: false
        cutoff_hz: 100.0

    wind:
      enable: false               # Wind is applied only after /crazyflie/in/wind is received.
      force: [0.0, 0.0, 0.0]      # Initial world-frame force [N]
      torque: [0.0, 0.0, 0.0]     # World-frame torque [N*m]
      indicator_force_gain: 1.0
      indicator_flutter_gain: 0.15
      indicator_flutter_hz: 6.0

    # ---- contact numerical diff + LPF params ----
    contact_filter:
      enable: true
      cutoff_hz: 5.0    # 지만 rad/s로 대입할 것
      timer_hz: 100.0       # 수치미분/필터 전용 콜백 주기
      use_exp_alpha: true

low_level_controller:
  ros__parameters:
    # ---------------- system ----------------
    mass: 0.04338 #0.041211
    g: 9.81

    # limits
    max_tilt_rad: 0.6108652382 #0.6108652382   # 35 deg
    max_rate: 8. #8.0                # rad/s
    max_tau: 0.2 #0.02              # 어차피 thrust선에서 컷 나니까 상관 x
    max_thrust: 1.0 #               # 나중에 제대로 바꾸길 검토

    # ---------------- loop dt ----------------
    # NOTE: timer period(코드)과 dt_* 파라미터(제어식 dt)는 "동일하게" 맞춰야 함
    dt:
      pos: 0.01       # 100 Hz
      vel: 0.01       # 100 Hz
      att: 0.005      # 200 Hz
      rate: 0.004    # 250 Hz

    # ---------------- gains ----------------
    # 반응성 높이면 좋음. 좋은게 좋은거.
    # Position loop: pos error -> v_des
    pos:
      x: { kp: 1.0, ki: 0.0, kd: 0.15, i_limit: 0.5 }
      y: { kp: 1.0, ki: 0.00, kd: 0.15, i_limit: 0.5 }
      z: { kp: 3.0, ki: 0.00, kd: 0.21, i_limit: 0.5 }

    # Velocity loop: vel error -> a_des
    vel:
      x: { kp: 3.0, ki: 0.0, kd: 0.1, i_limit: 0.5 }
      y: { kp: 3.0, ki: 0.0, kd: 0.1, i_limit: 0.5 }
      z: { kp: 3.0, ki: 0.0, kd: 0.1, i_limit: 0.5 }

    # Attitude loop: (roll_d, pitch_d, yaw_d) error -> w_des
    att:
      roll:  { kp: 8., ki: 1.0, kd: 0.1, i_limit: 0. }
      pitch: { kp: 8., ki: 1.0, kd: 0.1, i_limit: 0. }
      yaw:   { kp: 3., ki: 1.0, kd: 0.1, i_limit: 0. }

    # Rate loop: w error -> torque
    rate:
      roll:  { kp: 0.005, ki: 0.0005, kd: 0.00001, i_limit: 0.0 }
      pitch: { kp: 0.005, ki: 0.0005, kd: 0.00001, i_limit: 0.0 }
      yaw:   { kp: 0.005, ki: 0.0005, kd: 0.00001, i_limit: 0.0 }


trajectory_generation:
  ros__parameters:
    contact_force_x_topic: "/su/contact_force_x"
    wall_v_lat_contact_force_threshold: 0.005  # [N], enable v_lat_cmd only during contact
    normal_debug_metrics_topic: "/normal_vector/debug_metrics"
      
data_logger:
  ros__parameters:
    csv_dir: "~/sitl_ws/src/mujoco_crazyflie/flyingpen_interface/bag" # MJ
#    csv_dir: "~/mujoco_crazyflie/src/flyingpen_interface/bag" # SU
    compare_velocity_epsilon: 0.01
    compare_gamma_epsilon: 3.0e-3

panel:
  ros__parameters:
    selected: "" # "" -> auto-select from normal_estimator_method, or set "normal_vector_lvlf", "normal_vector_force", "normal_vector_mob"
    delay_sec: 1.5
    history_sec: 3.0
    update_hz: 30.0
    render_hz: 5.0
