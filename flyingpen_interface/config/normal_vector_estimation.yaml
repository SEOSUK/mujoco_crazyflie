normal_vector_estimation:
  ros__parameters:
    reference_object: "end_effector" # "drone" or "end_effector"
    normal_estimator_method: "new_normal" # "None", "direct", "kroc", "action_normal", "new_normal"
    publish_hz: 100.0

    flip_measured_force: false
    normal_force_threshold: 0.005 # minimum force magnitude [N] required to accept/update a normal estimate
    normal_lpf_alpha: 0.2

    force_observation_source: "mob" # "contact_force", "contact_force_filt", "mob", "mob_2nd", "mob_2nd_tau"

    new_normal:
      velocity_epsilon: 0.005 # [m/s] 이 값보다 작으면 속도 방향을 신뢰하지 않음
      velocity_gate: 0.005 # [m/s] geometry/velocity evidence 누적을 위한 부드러운 게이팅 스케일
      beta_v: 1.5 # [1/s]geometry/velocity 메모리 L_v의 forgetting gain
      sigma_v: 6.0 # geometry/velocity evidence의 누적 gain

      slip_blend_velocity: 0.04 # [m/s] 속도 직교 평면으로 force를 projection할 때 쓰는 slip blending 스케일
      force_epsilon: 0.004 # [N] 이 값보다 작으면 force 기반 normal candidate를 신뢰하지 않음
      force_gate: 0.02 # [N] force evidence 누적을 위한 부드러운 게이팅 스케일
      beta_f: 8.0 # force 메모리 L_f의 forgetting gain
      sigma_f: 8.0 # force evidence의 누적 gain

      c_v: 0.08 # geometry 신뢰도 바이어스, 클수록 rho_v가 더 보수적으로 올라감
      eps_lambda: 1.0e-4 # 고유값 gap 기반 신뢰도 계산 시 사용하는 수치 안정화 epsilon
      c_f: 0.015 # force 신뢰도 바이어스, 클수록 rho_f가 더 보수적으로 올라감
      eta_tau: 0.4 # consistency attenuation m_tau의 최소 바닥값
      sigma_tau: 0.004 # consistency attenuation 폭, 작을수록 불일치에 더 민감하게 패널티를 줌

      eps_alpha: 1.0e-6 # alpha_v / alpha_f 정규화 시 사용하는 수치 안정화 epsilon
      eps_l: 1.0e-6 # L_v, L_f trace 정규화 시 사용하는 수치 안정화 epsilon
      min_confidence: 0.08 # 최종 fused normal estimate를 채택하기 위한 최소 confidence
